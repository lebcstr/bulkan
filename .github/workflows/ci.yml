name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check scripts
        run: for f in scripts/*.mjs; do node --check "$f"; done

      - name: Browser smoke test
        run: |
          python3 -m http.server 8082 -d frontend &
          sleep 2
          cd tests
          npm ci
          npx playwright install --with-deps chromium
          node smoke.mjs
