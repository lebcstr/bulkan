name: Sync Sheets Data

on:
  schedule:
    - cron: '0 1 * * *'  # 09:00 PH time (UTC+8) — ~30 min after upstream sheet refresh at 08:30 PH
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync
        working-directory: scripts
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: npm run sync

      # Ash3d deposit models from the per-volcano Google Drive folders. A Drive
      # failure must not block the sheet snapshot, and leaves the last models in place.
      - name: Build ash deposit models
        working-directory: scripts
        continue-on-error: true
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: npm run ash

      - name: Commit snapshots
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add frontend/data/*.json
          git add -A frontend/data/ash
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m "chore(data): daily sheet snapshot"
            git push
          fi
