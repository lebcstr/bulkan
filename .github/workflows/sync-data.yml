name: Sync Sheets Data

on:
  schedule:
    - cron: '0 1 * * *'  # 09:00 PH time (UTC+8) — ~30 min after upstream sheet refresh at 08:30 PH
  workflow_dispatch:
    inputs:
      force_alert:
        description: 'Send the STA/LTA email even if the latest reading was already reported'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync
        working-directory: scripts
        run: npm run sync

      # Must run before the commit step: it compares against the last committed snapshot.
      - name: Check STA/LTA threshold
        id: stalta
        working-directory: scripts
        env:
          FORCE_ALERT: ${{ inputs.force_alert || 'false' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: npm run check-stalta

      - name: Email STA/LTA alert
        if: steps.stalta.outputs.alert == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_PORT == '465' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Bulkan Alerts <${{ secrets.SMTP_USERNAME }}>
          to: ${{ secrets.ALERT_RECIPIENTS }}
          subject: ${{ steps.stalta.outputs.subject }}
          html_body: file://${{ steps.stalta.outputs.body_file }}

      - name: Commit snapshots
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add frontend/data/*.json
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m "chore(data): daily sheet snapshot"
            git push
          fi
