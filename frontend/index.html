<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulkan has moved</title>
  <link rel="canonical" href="https://upri-noah.github.io/bulkan/">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://upri-noah.github.io/bulkan/">
  <script>
    // Keep the rest of the path, query and hash: /bulkan/x?y#z → new site /bulkan/x?y#z
    var rest = location.pathname.replace(/^\/bulkan/, '') || '/';
    location.replace('https://upri-noah.github.io/bulkan' + rest + location.search + location.hash);
  </script>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           font: 16px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; text-align: center; }
  </style>
</head>
<body>
  <p>Bulkan has moved to <a href="https://upri-noah.github.io/bulkan/">upri-noah.github.io/bulkan</a>.</p>
</body>
</html>
